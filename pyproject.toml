[project]
name = "rem-agno"
version = "0.1.0"
description = "A staged Agno + Discord foundation for Rem, the Re:Zero-inspired community companion."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "agno==3.1.3",
  "discord.py>=2.5,<3",
  "google-genai>=1.0.0",
  "groq>=0.30.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.31.0",
  "mem0ai[nlp]==2.2.1",
  "psycopg[binary,pool]>=3.2.0",
  "ddgs>=9.0.0",
  "httpx>=0.27.0",
  "requests>=2.31.0",
  "en-core-web-sm",
  "opentelemetry-sdk>=1.45.1",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1",
  "openinference-instrumentation-agno>=1.0.15",
  "openinference-instrumentation>=0.1.71",
]

[project.scripts]
rem-discord = "rem.discord_app:main"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rem"]
include = ["src/rem/**/*.py", "src/rem/*.sql"]

[tool.uv]
package = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
